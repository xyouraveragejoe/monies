<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #1c2333;
  --bg4: #21262d;
  --fg: #e6edf3;
  --fg2: #8b949e;
  --fg3: #6e7681;
  --border: #30363d;
  --border2: #21262d;
  --accent: #6366f1;
  --accent-glow: rgba(99,102,241,0.25);
  --accent2: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
  --card-glass: rgba(22,27,34,0.8);
  --input-bg: #0d1117;
  --nav-w: 220px;
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #f6f8fa; --bg2: #ffffff; --bg3: #f0f2f5; --bg4: #e8ecf0;
  --fg: #0d1117; --fg2: #57606a; --fg3: #6e7781;
  --border: #d0d7de; --border2: #e1e4e8;
  --accent: #6366f1; --accent-glow: rgba(99,102,241,0.15);
  --accent2: #059669; --amber: #d97706; --red: #dc2626;
  --card-glass: rgba(255,255,255,0.9); --input-bg: #ffffff;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;font-size:14px;background:var(--bg);color:var(--fg);overflow:hidden}
#root{height:100%;display:flex}
/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
/* Sidebar */
.sidebar{width:var(--nav-w);min-width:var(--nav-w);height:100%;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width 0.2s,min-width 0.2s}
.sidebar.collapsed{width:56px;min-width:56px}
.sidebar-logo{padding:18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.logo-icon{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.logo-text{font-family:'DM Sans',sans-serif;font-weight:700;font-size:14px;color:var(--fg);white-space:nowrap;overflow:hidden}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-group{margin-bottom:4px}
.nav-group-label{padding:8px 16px 4px;font-size:10px;font-weight:600;color:var(--fg3);letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.sidebar.collapsed .nav-group-label{opacity:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;border-radius:0;transition:background 0.15s;color:var(--fg2);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;position:relative;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--fg)}
.nav-item.active{background:var(--accent-glow);color:var(--accent)}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.nav-icon{font-size:15px;flex-shrink:0;width:22px;text-align:center}
.nav-label{overflow:hidden;text-overflow:ellipsis}
.sidebar-bottom{padding:12px;border-top:1px solid var(--border)}
.sidebar-toggle{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;cursor:pointer;color:var(--fg2);font-size:12px;transition:all 0.15s}
.sidebar-toggle:hover{color:var(--fg);border-color:var(--accent)}
/* Main */
.main{flex:1;height:100%;overflow-y:auto;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
.page-title{font-family:'DM Sans',sans-serif;font-weight:700;font-size:18px}
.topbar-actions{display:flex;align-items:center;gap:10px}
.page-content{flex:1;padding:24px;overflow-x:hidden}
/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:20px}
.card-sm{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px}
.card-glass{background:var(--card-glass);border:1px solid var(--border);border-radius:10px;padding:20px;backdrop-filter:blur(12px)}
/* Grid */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
/* KPI tile */
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi-label{font-size:11px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:0.06em}
.kpi-value{font-family:'DM Sans',sans-serif;font-size:26px;font-weight:700;line-height:1;color:var(--fg)}
.kpi-sub{font-size:12px;color:var(--fg2)}
.kpi-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:rgba(16,185,129,0.15);color:var(--accent2)}
.badge-red{background:rgba(239,68,68,0.15);color:var(--red)}
.badge-amber{background:rgba(245,158,11,0.15);color:var(--amber)}
.badge-accent{background:var(--accent-glow);color:var(--accent)}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all 0.15s;font-family:'Inter',sans-serif}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#5254cc}
.btn-ghost{background:transparent;color:var(--fg2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg3);color:var(--fg)}
.btn-danger{background:rgba(239,68,68,0.12);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.btn-danger:hover{background:rgba(239,68,68,0.2)}
.btn-green{background:rgba(16,185,129,0.15);color:var(--accent2);border:1px solid rgba(16,185,129,0.2)}
.btn-sm{padding:5px 10px;font-size:12px}
/* Inputs */
.input-group{display:flex;flex-direction:column;gap:5px}
.input-label{font-size:12px;font-weight:500;color:var(--fg2)}
.input{width:100%;padding:8px 12px;background:var(--input-bg);border:1px solid var(--border);border-radius:7px;color:var(--fg);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border 0.15s}
.input:focus{border-color:var(--accent)}
.input-prefix{position:relative}
.input-prefix .input{padding-left:26px}
.input-prefix .pfx{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg3);font-size:13px}
select.input{cursor:pointer}
textarea.input{resize:vertical;min-height:72px}
/* Progress bar */
.progress-wrap{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width 0.6s ease}
.progress-lg .progress-wrap{height:14px;border-radius:7px}
/* Health ring */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
/* Table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:0.06em;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border2);font-size:13px}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg3)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}
/* Alert */
.alert{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:8px;font-size:13px}
.alert-warn{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);color:var(--amber)}
.alert-danger{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:var(--red)}
.alert-success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);color:var(--accent2)}
.alert-info{background:var(--accent-glow);border:1px solid rgba(99,102,241,0.3);color:var(--accent)}
/* Divider */
.divider{height:1px;background:var(--border);margin:8px 0}
/* Chip */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg3);color:var(--fg2);border:1px solid var(--border)}
/* Section header */
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-title{font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px}
/* Spacing */
.stack{display:flex;flex-direction:column}
.stack-sm{gap:8px}
.stack-md{gap:16px}
.stack-lg{gap:24px}
.row{display:flex;align-items:center}
.row-between{display:flex;align-items:center;justify-content:space-between}
.gap-sm{gap:8px}
.gap-md{gap:14px}
/* Chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 200px)}
.chat-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px}
.chat-bubble{max-width:75%;padding:12px 15px;border-radius:10px;font-size:13px;line-height:1.6}
.chat-user{align-self:flex-end;background:var(--accent);color:#fff}
.chat-ai{align-self:flex-start;background:var(--bg3);color:var(--fg);border:1px solid var(--border)}
.chat-input-row{display:flex;gap:8px;padding:16px;border-top:1px solid var(--border)}
/* Toggle */
.toggle{width:40px;height:22px;background:var(--border);border-radius:11px;cursor:pointer;position:relative;transition:background 0.2s;border:none}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left 0.2s}
.toggle.on::after{left:21px}
/* Scenario card */
.scenario-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all 0.15s}
.scenario-card:hover{border-color:var(--accent)}
.scenario-card.active{border-color:var(--accent);background:var(--accent-glow)}
/* Timeline */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.tl-item{position:relative;padding-bottom:24px}
.tl-dot{position:absolute;left:-24px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--bg2);border:2px solid var(--border)}
.tl-dot.done{background:var(--accent2);border-color:var(--accent2)}
.tl-dot.active{background:var(--accent);border-color:var(--accent)}
/* Grid dots bg */
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,var(--border2) 1px,transparent 1px);background-size:28px 28px;opacity:0.4;pointer-events:none;z-index:0}
.sidebar,.main{position:relative;z-index:1}
/* Glow accent line at top */
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0.5}
/* Responsive */
@media(max-width:768px){
  .sidebar{position:fixed;left:-var(--nav-w);z-index:50;transform:translateX(-100%)}
  .sidebar.mobile-open{transform:translateX(0)}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .page-content{padding:16px}
  .modal{margin:10px}
}
/* Scrollable sub-content */
.scroll-x{overflow-x:auto}
/* Recharts tooltip override */
.recharts-tooltip-wrapper .recharts-default-tooltip{background:var(--bg2) !important;border:1px solid var(--border) !important;border-radius:8px !important;color:var(--fg) !important}
</style>

/* ── helpers ── */

const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
const fmt=(n,curr='USD')=>new Intl.NumberFormat('en-US',{style:'currency',currency:curr,maximumFractionDigits:0}).format(n||0);
const fmtK=(n)=>{const a=Math.abs(n);const s=n<0?'-':'';return a>=1e6?`${s}$${(a/1e6).toFixed(1)}M`:a>=1e3?`${s}$${(a/1e3).toFixed(0)}K`:`${s}${fmt(a)}`};
const fmtPct=(n)=>`${(n||0).toFixed(1)}%`;
const fv=(r,n,pmt,pv)=>pv*Math.pow(1+r,n)+(r===0?pmt*n:pmt*((Math.pow(1+r,n)-1)/r));
const pmtCalc=(r,n,pv)=>n===0?0:r===0?pv/n:(pv*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);

/* ── NumInput ── */
function NumInput({value,onChange,min=0,max=999999999,step=1,style,placeholder,prefix,disabled}){
  const[raw,setRaw]=useState(String(value??0));
  const[focused,setFocused]=useState(false);
  useEffect(()=>{if(!focused)setRaw(String(value??0));},[value,focused]);
  const commit=()=>{
    setFocused(false);
    const p=parseFloat(raw);
    if(isNaN(p)){setRaw(String(value??0));return;}
    const clamped=clamp(p,min,max);
    const final=step<1?parseFloat(clamped.toFixed(2)):Math.round(clamped);
    setRaw(String(final));
    if(final!==value)onChange(final);
  };
  return React.createElement('div',{style:{position:'relative',display:'flex',alignItems:'center',...style}},
    prefix&&React.createElement('span',{style:{position:'absolute',left:10,color:'var(--fg3)',fontSize:13,pointerEvents:'none'}},prefix),
    React.createElement('input',{
      type:'text',inputMode:'decimal',value:raw,placeholder,disabled,
      style:{width:'100%',padding:prefix?'8px 12px 8px 24px':'8px 12px',background:'var(--input-bg)',border:'1px solid var(--border)',borderRadius:7,color:'var(--fg)',fontSize:13,fontFamily:'Inter,sans-serif',outline:'none',transition:'border 0.15s',opacity:disabled?0.5:1},
      onFocus:()=>{setFocused(true);setRaw(String(value??0));},
      onChange:e=>{if(/^-?\d*\.?\d*$/.test(e.target.value)||e.target.value==='-')setRaw(e.target.value);},
      onBlur:commit,
      onKeyDown:e=>{if(e.key==='Enter')e.currentTarget.blur();}
    })
  );
}

  const[state,setState]=useState({
    profile:D_PROFILE,income:D_INCOME,expenses:D_EXPENSES,
    assets:[...D_ASSETS],debts:{...D_DEBTS,creditCards:[...D_DEBTS.creditCards],loans:[...D_DEBTS.loans],mortgage:{...D_DEBTS.mortgage}},
    retirement:{...D_RETIREMENT},predictor:{...D_PREDICTOR},
    goals:[...D_GOALS],scenarios:[...D_SCENARIOS],ai:{...D_AI},lifestyle:{...D_LIFESTYLE}
  });

  useEffect(()=>{
    (async()=>{
      const s=await storageGet('flp_state_v3',null);
      if(s)setState(s);
      setLoaded(true);
    })();
  },[]);

  const save=useCallback((ns)=>{
    setSaving(true);
    clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{
      await storageSet('flp_state_v3',ns);
      setSaving(false);
    },800);
  },[]);

  const upd=(key,val)=>setState(prev=>{
    const ns={...prev,[key]:val};
    save(ns);
    return ns;
  });

  const updPath=(key,sub,val)=>upd(key,{...state[key],[sub]:val});

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',darkMode?'dark':'light');
  },[darkMode]);

  // ── derived financials ──
  const totalIncome=state.income.salary+(state.income.bonus/12)+state.income.sideIncome+state.income.otherIncome;
  const totalExpenses=Object.values(state.expenses).reduce((a,b)=>a+b,0);
  const monthlySurplus=totalIncome-totalExpenses;
  const savingsRate=totalIncome>0?(monthlySurplus/totalIncome)*100:0;
  const totalAssets=state.assets.reduce((a,b)=>a+b.value,0);
  const totalCCDebt=state.debts.creditCards.reduce((a,b)=>a+b.balance,0);
  const totalLoanDebt=state.debts.loans.reduce((a,b)=>a+b.balance,0);
  const totalMortgage=state.debts.mortgage.balance||0;
  const totalDebt=totalCCDebt+totalLoanDebt+totalMortgage;
  const netWorth=totalAssets-totalDebt;
  const cashAssets=state.assets.filter(a=>a.type==='cash').reduce((a,b)=>a+b.value,0);
  const investAssets=state.assets.filter(a=>a.type==='investment'||a.type==='retirement').reduce((a,b)=>a+b.value,0);
  const debtRatio=totalIncome>0?(totalDebt/(totalIncome*12))*100:0;
  const burnRate=totalExpenses/Math.max(cashAssets,1)*30; // days of runway
  const healthScore=Math.min(100,Math.max(0,
    (savingsRate>20?25:savingsRate>10?15:savingsRate>0?5:0)+
    (debtRatio<36?25:debtRatio<50?15:debtRatio<80?5:0)+
    (cashAssets>=totalExpenses*6?25:cashAssets>=totalExpenses*3?15:cashAssets>=totalExpenses?5:0)+
    (netWorth>0?25:netWorth>-10000?10:0)
  ));

  const derived={totalIncome,totalExpenses,monthlySurplus,savingsRate,totalAssets,totalDebt,netWorth,cashAssets,investAssets,debtRatio,burnRate,healthScore,totalCCDebt,totalLoanDebt,totalMortgage};

  if(!loaded)return React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:'var(--fg2)',gap:12}},
    React.createElement('div',{style:{width:20,height:20,border:'2px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}),
    'Loading your data...'
  );

  const currentNav=NAV.flatMap(g=>g.items).find(i=>i.id===page);

  return React.createElement('div',{id:'app-root',style:{display:'flex',height:'100%'}},
    /* Sidebar */
    React.createElement('aside',{className:`sidebar${sideCollapsed?' collapsed':''}`},
      React.createElement('div',{className:'sidebar-logo'},
        React.createElement('div',{className:'logo-icon'},'◊'),
        !sideCollapsed&&React.createElement('span',{className:'logo-text'},'Finance Life')
      ),
      React.createElement('nav',{className:'sidebar-nav'},
        NAV.map(group=>React.createElement('div',{key:group.group,className:'nav-group'},
          React.createElement('div',{className:'nav-group-label'},group.group),
          group.items.map(item=>React.createElement('div',{
            key:item.id,
            className:`nav-item${page===item.id?' active':''}`,
            onClick:()=>setPage(item.id)
          },
            React.createElement('span',{className:'nav-icon'},item.icon),
            !sideCollapsed&&React.createElement('span',{className:'nav-label'},item.label)
          ))
        ))
      ),
      React.createElement('div',{className:'sidebar-bottom'},
        React.createElement('button',{className:'sidebar-toggle',onClick:()=>setSideCollapsed(p=>!p)},
          sideCollapsed?'→':'← Collapse'
        )
      )
    ),
    /* Main */
    React.createElement('div',{className:'main'},
      React.createElement('div',{className:'topbar'},
        React.createElement('div',{className:'page-title'},currentNav?.label||'Finance Life Planner'),
        React.createElement('div',{className:'topbar-actions'},
          saving&&React.createElement('span',{style:{fontSize:11,color:'var(--fg3)'}},saving?'Saving...':''),
          React.createElement('button',{className:'btn btn-ghost btn-sm',onClick:()=>setDarkMode(p=>!p)},darkMode?'☀ Light':'☾ Dark'),
          React.createElement('div',{style:{display:'flex',alignItems:'center',gap:8,padding:'6px 12px',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:7}},
            React.createElement('span',{style:{fontSize:11,color:'var(--fg3)'}},healthScore>=80?'🟢':healthScore>=50?'🟡':'🔴'),
            React.createElement('span',{style:{fontSize:12,fontWeight:600}},`${healthScore}/100`)
          )
        )
      ),
      React.createElement('div',{className:'page-content'},
        page==='dashboard'&&React.createElement(PageDashboard,{state,derived,setPage}),
        page==='snapshot'&&React.createElement(PageSnapshot,{state,upd,updPath,derived}),
        page==='expenses'&&React.createElement(PageExpenses,{state,upd,derived}),
        page==='assets'&&React.createElement(PageAssets,{state,upd,modal,setModal}),
        page==='debts'&&React.createElement(PageDebts,{state,upd,derived,modal,setModal}),
        page==='retirement'&&React.createElement(PageRetirement,{state,upd,derived}),
        page==='predictor'&&React.createElement(PagePredictor,{state,upd,derived}),
        page==='scenarios'&&React.createElement(PageScenarios,{state,upd,derived,modal,setModal}),
        page==='lifestyle'&&React.createElement(PageLifestyle,{state,upd,derived}),
        page==='roadmap'&&React.createElement(PageRoadmap,{state,upd,modal,setModal}),
        page==='ai'&&React.createElement(PageAI,{state,upd,derived})
      )
    ),
    /* Modals */
    modal&&React.createElement(ModalRouter,{modal,setModal,state,upd})
  );
}

/* ══════════════════════════════════════════
   PAGE: DASHBOARD
══════════════════════════════════════════ */
function PageDashboard({state,derived,setPage}){
  const{netWorth,monthlySurplus,savingsRate,healthScore,totalAssets,totalDebt}=derived;
  const age=state.profile.age;
  // Net worth projection (30 years)
  const r=(state.retirement.returnRate/100)/12;
  const projData=Array.from({length:31},(_,i)=>{
    const months=i*12;
    const projected=fv(r,months,Math.max(monthlySurplus,0),netWorth);
    return{year:age+i,value:Math.max(projected,0)};
  });
  const level=netWorth<10000?1:netWorth<50000?2:netWorth<100000?3:netWorth<500000?4:5;
  const levelLabel=['','Starter','Builder','Grower','Achiever','Wealthy'][level];
  const goalProgress=state.goals.map(g=>({...g,pct:Math.min(100,(g.currentAmount/g.targetAmount)*100)}));
  const warnings=[];
  if(savingsRate<10)warnings.push({type:'warn',msg:'Savings rate below 10% — increase monthly contributions'});
  if(derived.cashAssets<derived.totalExpenses*3)warnings.push({type:'warn',msg:'Emergency fund below 3 months — top it up'});
  if(totalDebt>totalAssets*0.5)warnings.push({type:'danger',msg:'High debt-to-asset ratio — prioritize debt payoff'});
  if(monthlySurplus<0)warnings.push({type:'danger',msg:'Monthly deficit detected — review your expenses'});

  return React.createElement('div',{className:'stack stack-lg'},
    /* Level + KPIs */
    React.createElement('div',{style:{display:'flex',alignItems:'center',gap:12,marginBottom:4}},
      React.createElement('div',{style:{padding:'4px 14px',background:'var(--accent-glow)',border:'1px solid var(--accent)',borderRadius:20,fontSize:11,fontWeight:700,color:'var(--accent)',letterSpacing:'0.08em'}},`LEVEL ${level} · ${levelLabel}`),
      React.createElement('span',{style:{fontSize:12,color:'var(--fg3)'}},`Net worth milestone: ${fmtK(netWorth)}`)
    ),
    React.createElement('div',{className:'grid4'},
      React.createElement('div',{className:'card kpi'},
        React.createElement('div',{className:'kpi-label'},'Net Worth'),
        React.createElement('div',{className:'kpi-value',style:{color:netWorth>=0?'var(--fg)':'var(--red)'}},fmtK(netWorth)),
        React.createElement('div',{className:'kpi-sub'},`Assets ${fmtK(totalAssets)} · Debt ${fmtK(totalDebt)}`)
      ),
      React.createElement('div',{className:'card kpi'},
        React.createElement('div',{className:'kpi-label'},'Monthly Surplus'),
        React.createElement('div',{className:'kpi-value',style:{color:monthlySurplus>=0?'var(--accent2)':'var(--red)'}},fmtK(monthlySurplus)),
        React.createElement('div',{className:'kpi-sub'},`Income ${fmtK(derived.totalIncome)} · Spend ${fmtK(derived.totalExpenses)}`)
      ),
      React.createElement('div',{className:'card kpi'},
        React.createElement('div',{className:'kpi-label'},'Savings Rate'),
        React.createElement('div',{className:'kpi-value'},fmtPct(savingsRate)),
        React.createElement('div',{className:'progress-wrap',style:{marginTop:6}},
          React.createElement('div',{className:'progress-fill',style:{width:`${clamp(savingsRate,0,100)}%`,background:savingsRate>20?'var(--accent2)':savingsRate>10?'var(--amber)':'var(--red)'}})
        )
      ),
      React.createElement('div',{className:'card kpi'},
        React.createElement('div',{className:'kpi-label'},'Health Score'),
        React.createElement('div',{className:'kpi-value'},`${healthScore}`),
        React.createElement('div',{className:'progress-wrap',style:{marginTop:6}},
          React.createElement('div',{className:'progress-fill',style:{width:`${healthScore}%`,background:healthScore>=80?'var(--accent2)':healthScore>=50?'var(--amber)':'var(--red)'}})
        )
      )
    ),
    /* Chart + Goals */
    React.createElement('div',{className:'grid2'},
      React.createElement('div',{className:'card',style:{gridColumn:'1/2'}},
        React.createElement('div',{className:'sec-header'},
          React.createElement('div',{className:'sec-title'},'Net Worth Projection'),
          React.createElement('span',{className:'chip'},`${state.retirement.returnRate}% return`)
        ),
        React.createElement(ResponsiveContainer,{width:'100%',height:200},
          React.createElement(AreaChart,{data:projData,margin:{top:5,right:5,left:5,bottom:5}},
            React.createElement('defs',null,
              React.createElement('linearGradient',{id:'nwGrad',x1:'0',y1:'0',x2:'0',y2:'1'},
                React.createElement('stop',{offset:'5%',stopColor:'#6366f1',stopOpacity:0.3}),
                React.createElement('stop',{offset:'95%',stopColor:'#6366f1',stopOpacity:0})
              )
            ),
            React.createElement(CartesianGrid,{strokeDasharray:'3 3',stroke:'var(--border2)'}),
            React.createElement(XAxis,{dataKey:'year',tick:{fontSize:10,fill:'var(--fg3)'},tickLine:false}),
            React.createElement(YAxis,{tick:{fontSize:10,fill:'var(--fg3)'},tickLine:false,tickFormatter:v=>fmtK(v)}),
            React.createElement(Tooltip,{formatter:(v)=>[fmtK(v),'Net Worth'],contentStyle:{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,fontSize:12}}),
            React.createElement(Area,{type:'monotone',dataKey:'value',stroke:'#6366f1',fill:'url(#nwGrad)',strokeWidth:2})
          )
        )
      ),
      React.createElement('div',{className:'card'},
        React.createElement('div',{className:'sec-header'},
          React.createElement('div',{className:'sec-title'},'Goal Progress'),
          React.createElement('button',{className:'btn btn-ghost btn-sm',onClick:()=>{}},'+')
        ),

              React.createElement('span',{style:{fontSize:13,fontWeight:500}},g.label),

  const inflAdj=r.inflation/100;
  const retRate=r.returnRate/100;

  const required=retIncome/swr;
  const currentPortfolio=investAssets;
  const mRate=(retRate-inflAdj)/12;
  const months=yearsLeft*12;
  const portfolioAtRetire=fv(mRate,months,r.monthlyContrib,currentPortfolio);
  const gap=required-portfolioAtRetire;

/* ══════════════════════════════════════════
   PAGE: PREDICTOR
══════════════════════════════════════════ */
function PagePredictor({state,upd,derived}){
  const p=state.predictor;
  const age=state.profile.age;
  const{investAssets}=derived;
  const currentSavings=investAssets;
  const setP=k=>v=>upd('predictor',{...p,[k]:v});
  const rates={conservative:5,moderate:7,aggressive:9};
  const calcRetireAge=(r,desiredIncome,monthly,savings)=>{
    const required=desiredIncome/0.04;
    const mRate=(r/100)/12;
    for(let yr=age+1;yr<=75;yr++){
      const months=(yr-age)*12;
      const pf=fv(mRate,months,monthly,savings);
      if(pf>=required)return yr;
    }
    return 75;
  };
  const conservative=calcRetireAge(rates.conservative,p.desiredIncome,p.monthlyInvest,currentSavings);
  const base=calcRetireAge(rates.moderate,p.desiredIncome,p.monthlyInvest,currentSavings);
  const aggressive=calcRetireAge(rates.aggressive,p.desiredIncome,p.monthlyInvest,currentSavings);

  const chartData=Array.from({length:31},(_,i)=>{
    const months=i*12;
    return{
      year:age+i,
      conservative:Math.round(fv((rates.conservative/100)/12,months,p.monthlyInvest,currentSavings)),
      base:Math.round(fv((rates.moderate/100)/12,months,p.monthlyInvest,currentSavings)),
      aggressive:Math.round(fv((rates.aggressive/100)/12,months,p.monthlyInvest,currentSavings)),
    };
  });

  return React.createElement('div',{className:'stack stack-lg'},
    React.createElement('div',{className:'grid2'},
      React.createElement('div',{className:'card stack stack-md'},
        React.createElement('div',{className:'sec-title'},'⚙️ Inputs'),

      React.createElement('div',{className:'card stack stack-md'},
        React.createElement('div',{className:'sec-title'},'🔮 Retirement Ages'),
        [['Conservative (5%)',conservative,'fg3'],['Base Case (7%)',base,'accent'],['Aggressive (9%)',aggressive,'accent2']].map(([l,v,c])=>
          React.createElement('div',{key:l,style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 0',borderBottom:'1px solid var(--border2)'}},
            React.createElement('span',{style:{fontSize:13,color:'var(--fg2)'}},l),
            React.createElement('span',{style:{fontSize:24,fontWeight:700,color:`var(--${c})`,fontFamily:'DM Sans,sans-serif'}},`Age ${v}`)
          )
        )
      )
    ),
    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'sec-title',style:{marginBottom:16}},'Wealth Trajectory by Scenario'),
      React.createElement(ResponsiveContainer,{width:'100%',height:260},
        React.createElement(LineChart,{data:chartData,margin:{top:5,right:5,left:5,bottom:5}},
          React.createElement(CartesianGrid,{strokeDasharray:'3 3',stroke:'var(--border2)'}),
          React.createElement(XAxis,{dataKey:'year',tick:{fontSize:10,fill:'var(--fg3)'}}),
          React.createElement(YAxis,{tick:{fontSize:10,fill:'var(--fg3)'},tickFormatter:v=>fmtK(v)}),
          React.createElement(Tooltip,{formatter:(v,n)=>[fmtK(v),n],contentStyle:{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,fontSize:12}}),

function PageAI({state,upd,derived}){
  const ai=state.ai;
  const[input,setInput]=useState('');
  const[loading,setLoading]=useState(false);
  const messagesEndRef=useRef(null);

  const setAI=v=>upd('ai',{...ai,...v});

  const scrollToBottom=()=>messagesEndRef.current?.scrollIntoView({behavior:'smooth'});
  useEffect(scrollToBottom,[ai.messages]);

  const buildContext=()=>`
User Financial Profile:
- Age: ${state.profile.age}, Country: ${state.profile.country}
- Monthly Income: $${derived.totalIncome.toFixed(0)}
- Monthly Expenses: $${derived.totalExpenses.toFixed(0)}
- Monthly Surplus: $${derived.monthlySurplus.toFixed(0)}
- Net Worth: $${derived.netWorth.toFixed(0)}
- Total Assets: $${derived.totalAssets.toFixed(0)}
- Total Debt: $${derived.totalDebt.toFixed(0)}
- Savings Rate: ${derived.savingsRate.toFixed(1)}%
- Health Score: ${derived.healthScore}/100
- Target Retire Age: ${state.profile.retireAge}
`;

  const sendMessage=async(text)=>{
    if(!ai.apiKey){alert('Please enter your Claude API key first.');return;}
    if(!text.trim())return;
    const newMsgs=[...ai.messages,{role:'user',content:text}];
    setAI({messages:newMsgs});
    setInput('');
    setLoading(true);
    try{
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'x-api-key':ai.apiKey,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1500,system:`You are a professional financial advisor and CFO. ${buildContext()} Be direct, specific, and actionable. Format with clear points.`,messages:newMsgs.map(m=>({role:m.role,content:m.content}))})
      });
      const d=await res.json();
      const reply=d.content?.[0]?.text||'Sorry, I could not generate a response.';
      setAI({messages:[...newMsgs,{role:'assistant',content:reply}]});
    }catch(e){
      setAI({messages:[...newMsgs,{role:'assistant',content:`Error: ${e.message}`}]});
    }
    setLoading(false);
  };

  const quickQ=['Can I retire by age 50?','How to eliminate my debt faster?','Am I saving enough?','What should I invest in now?','How to increase my net worth?'];

  return React.createElement('div',{className:'stack stack-lg'},
    /* API Key */
    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'sec-title',style:{marginBottom:12}},'🔑 Claude API Key'),

        React.createElement('button',{className:'btn btn-primary',onClick:()=>sendMessage('Analyze my financial situation and provide a comprehensive strategy report with specific action items.')},'Generate Report')
      ),
      React.createElement('div',{style:{fontSize:11,color:'var(--fg3)',marginTop:6}},'Your key is stored locally and never sent anywhere except Anthropic\'s API.')
    ),
    /* Quick Questions */
    React.createElement('div',{className:'card'},
      React.createElement('div',{className:'sec-title',style:{marginBottom:12}},'Quick Questions'),
      React.createElement('div',{className:'row',style:{flexWrap:'wrap',gap:8}},
        quickQ.map(q=>React.createElement('button',{key:q,className:'btn btn-ghost btn-sm',onClick:()=>sendMessage(q)},q))
      )
    ),
    /* Chat */
    React.createElement('div',{className:'card',style:{padding:0,overflow:'hidden'}},
      React.createElement('div',{style:{padding:'14px 16px',borderBottom:'1px solid var(--border)'}},
        React.createElement('div',{className:'sec-title'},'💬 AI Financial Advisor')
      ),
      React.createElement('div',{className:'chat-messages',style:{minHeight:300}},
        ai.messages.length===0&&React.createElement('div',{style:{textAlign:'center',color:'var(--fg3)',padding:40}},
          React.createElement('div',{style:{fontSize:32,marginBottom:12}},'◊'),
          React.createElement('div',{style:{fontSize:14,fontWeight:500}},'Your AI Financial Advisor'),
          React.createElement('div',{style:{fontSize:12,marginTop:4}},'Ask me anything about your finances')
        ),
        ai.messages.map((m,i)=>React.createElement('div',{key:i,className:`chat-bubble chat-${m.role==='user'?'user':'ai'}`},m.content)),
        loading&&React.createElement('div',{className:'chat-bubble chat-ai',style:{display:'flex',gap:6,alignItems:'center'}},
          React.createElement('div',{style:{width:6,height:6,borderRadius:'50%',background:'var(--fg3)',animation:'pulse 1s infinite'}}),
          React.createElement('div',{style:{width:6,height:6,borderRadius:'50%',background:'var(--fg3)',animation:'pulse 1s 0.2s infinite'}}),
          React.createElement('div',{style:{width:6,height:6,borderRadius:'50%',background:'var(--fg3)',animation:'pulse 1s 0.4s infinite'}})
        ),
        React.createElement('div',{ref:messagesEndRef})
      ),
      React.createElement('div',{className:'chat-input-row'},
        React.createElement('input',{className:'input',value:input,placeholder:'Ask your AI financial advisor...',style:{flex:1},onChange:e=>setInput(e.target.value),onKeyDown:e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(input);}}}),
        React.createElement('button',{className:'btn btn-primary',onClick:()=>sendMessage(input),disabled:loading},'Send')
      )
    )
  );
