# Keeps the free Supabase project from being paused for inactivity.
# Once a day it asks the database to run a harmless function (public.ping, see supabase/migrations/003_ping.sql).
#
# One-time setup (GitHub repo > Settings > Secrets and variables > Actions). Add both names as a
# repository VARIABLE (Variables tab) or as a repository SECRET (Secrets tab); either works:
#   SUPABASE_URL              e.g. https://abcdxyz.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  the same public (publishable) key the website uses. Never the secret/service_role key.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * *'   # every day at 03:17 UTC
  workflow_dispatch:        # lets you press "Run workflow" to test it

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Copy-and-paste often adds a hidden newline or space (or quote marks); strip them.
          SUPABASE_URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]"'"'")
          SUPABASE_KEY=$(printf '%s' "$SUPABASE_KEY" | tr -d '[:space:]"'"'")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY is empty. Add both under Settings > Secrets and variables > Actions, spelled exactly like that, as repository-level (not Environment-level) entries."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL must start with https:// (it should look like https://abcdxyz.supabase.co)."; exit 1 ;;
          esac
          code=$(curl --silent --show-error --max-time 30 --retry 3 --retry-delay 10 \
            --output response.txt --write-out '%{http_code}' \
            --request POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            --header "apikey: ${SUPABASE_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}')
          echo "HTTP status: $code"
          cat response.txt; echo
          if [ "$code" != "200" ]; then
            echo "::error::Ping failed (status $code). If it is 404 run supabase/migrations/003_ping.sql; if the project is paused, resume it in the Supabase dashboard."
            exit 1
          fi
